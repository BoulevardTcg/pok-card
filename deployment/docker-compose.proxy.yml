# Reverse proxy Caddy — à lancer en parallèle des backends
# Usage: docker compose -f deployment/docker-compose.proxy.yml up -d
#
# Prérequis : les backends tournent (Docker ou local) sur 8080 et 8081.
# Le front Marketplace tourne (npm run dev) sur 5174.
#
# Résultat : http://localhost:3000
#   /api/*    → Boutique   (8080)
#   /market/* → Marketplace (8081)
#   /*        → Front       (5174)
#
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Important:
    # - Docker Desktop (Win/Mac): host.docker.internal existe déjà
    # - Linux: on ajoute host.docker.internal via host-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
