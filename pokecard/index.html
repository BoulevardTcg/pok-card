<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>BoulevardTCG — Le Boulevard Prestige du TCG</title>

    <!-- Méta par défaut (fallback pour les crawlers lisant le HTML brut ;
         surchargées par page via le composant <Seo /> côté React) -->
    <meta
      name="description"
      content="BoulevardTCG, votre boutique TCG par des passionnés : produits scellés et cartes à collectionner Pokémon, One Piece, Magic, Yu-Gi-Oh! et Lorcana."
    />
    <link rel="canonical" href="https://boulevardtcg.com/" />
    <meta property="og:site_name" content="BoulevardTCG" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BoulevardTCG — Le Boulevard Prestige du TCG" />
    <meta
      property="og:description"
      content="Votre boutique TCG par des passionnés : produits scellés et cartes à collectionner Pokémon, One Piece, Magic, Yu-Gi-Oh! et Lorcana."
    />
    <meta property="og:url" content="https://boulevardtcg.com/" />
    <meta property="og:image" content="https://boulevardtcg.com/carte_accueil/dracaufeu.png" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Script anti-flash : applique le thème AVANT le rendu.
         Externalisé (et non inline) pour être compatible avec la
         Content-Security-Policy (script-src 'self', sans 'unsafe-inline'). -->
    <script src="/theme-init.js"></script>
    
    <!-- Préchargement de l'image LCP du hero (première carte affichée) -->
    <link rel="preload" as="image" href="/carte_accueil/card02.png" fetchpriority="high" />

    <!-- Google Fonts - Typographie Luxe Parisien.
         Playfair Display retiré (inutilisé) ; seules Inter (corps) et
         Cormorant Garamond (titres) sont réellement employées. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
